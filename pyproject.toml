[project]
name = "rearc-data-quest"
version = "0.1.0"
description = "Rearc Data Quest (Databricks Edition): BLS productivity + ACS population, modelled Bronze/Silver/Gold"
requires-python = ">=3.11,<3.12"

# Runtime deps for the *local* half of this project only: source discovery and
# download. Spark and Databricks runtime libraries are provided by serverless
# compute and are declared in the bundle config, never installed here.
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# src/ is deliberately not an installed package (package = false above), so the
# tests need it on the path. Keeps the layout flat while the project is still a
# set of scripts rather than a wheel.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
